working_papers:
  - title: "Market Power in the New England Electricity Market: Evidence from Nuclear Refueling Outages"
    coauthors: "Ming Ge, James Ji, and Matt Woerman"
    status: ""
    abstract: |
      Each of New England's four nuclear reactors refuels roughly every 18 months, taking it offline
      for about a month. We use these scheduled outages as supply shocks to study market power in the
      ISO New England wholesale electricity market. Using day-ahead market data from 2016 to 2018, we
      find that market-clearing prices rise by about $4.9/MWh on average when at least one reactor is
      offline. Examining how suppliers adjust their bids during these outages, we attribute roughly 36%
      of the price increase to the exercise of market power, a transfer from consumers to suppliers of
      about $43–45 million per year.
    links:
      - name: SSRN
        icon: ssrn
        icon_pack: ai
        url: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=4616702
  - title: "Can Driver-Assistance Technology Offset the Vehicle-Weight Externality?"
    coauthors: "Yongjoon Park"
    status: "Work in progress"
    abstract: |
      We examine whether technology can offset a well-documented externality in transportation. Heavier
      vehicles protect their own occupants but impose risk on the occupants of the vehicles they hit;
      Anderson and Auffhammer (2014) show that being struck by a vehicle 1,000 pounds heavier raises
      fatality risk by 40 to 50 percent. Since then, vehicles have become both heavier and far more likely
      to carry advanced driver-assistance systems. Using about 785,000 vehicle-level records from
      Massachusetts crash reports between 2021 and 2025, matched to curb weight and driver-assistance
      equipment through VIN decoding, we first confirm the weight externality in a modern fleet: in
      two-vehicle crashes, holding a vehicle's own weight fixed, a 1,000-pound heavier collision partner
      raises the probability of severe or fatal injury by about 13 percent relative to the baseline rate.
      Preliminary results show that all seven driver-assistance features we examine are associated with
      a smaller weight externality, and that the association is statistically significant for dynamic
      brake support. Because these features are bundled in trim packages and correlated with vehicle age
      and segment, we next exploit their staggered introduction across model years to move toward causal
      estimates. If driver-assistance technology does mitigate the weight externality, safety-technology
      mandates could partially offset the external cost of a heavier, increasingly electric vehicle fleet.
    links: []

