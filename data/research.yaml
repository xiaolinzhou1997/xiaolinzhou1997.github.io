jmp:
  title: "Subsidies, Cost Trends, and Pass-Through: Evidence from the Residential Solar Market"
  coauthors: ""
  status: "Latest version: November 2026"
  abstract: |
    Clean energy subsidies are one of the main instruments in climate policy. Their values are designed
    to fall as technology adoption grows, but costs generally change over the same horizon, confounding
    the estimates of pass-through. I study two Massachusetts programs that pay homeowners per
    kilowatt-hour based on energy produced. To overcome timing challenges, I employ a novel identification
    strategy: estimating pass-through from differences in the subsidy across roofs that the same installer
    equips at the same time, because the subsidy depends on each roof's generation. I find that buyers
    receive about 85 percent of the subsidy under both designs, whereas a comparison over time gives a
    biased estimate. Installers raise prices only slightly for roofs that earn larger subsidies, which in
    this setting bounds the markup from roof-specific price discrimination at 2–7 percent of price.
  # Shown beside the abstract on the homepage ("Key findings"). Delete the list to hide the panel.
  highlights:
    - value: "≈ 85%"
      label: "of the subsidy reaches buyers, under both the certificate-based and the fixed-rate design"
    - value: "−0.02"
      label: "difference in pass-through between the two designs (s.e. 0.085), against the 26-point gap that a comparison over time suggests"
    - value: "2–7%"
      label: "upper bound on the markup from roof-specific price discrimination, as a share of price, given log-concave demand"
  links:
