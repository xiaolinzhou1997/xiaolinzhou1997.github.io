working_papers:
  - title: "Market Power in the New England Electricity Market: Evidence from Nuclear Refueling Outages"
    coauthors: "Ming Ge, James Ji, and Matt Woerman"
    status: ""
    abstract: |
      Each of New England's four nuclear reactors refuels roughly every 18 months, taking it offline
      for about a month. We use these scheduled outages as supply shocks to study market power in the
      ISO New England wholesale electricity market. Using day-ahead market data from 2016 to 2018, we
      find that market-clearing prices rise by about $4.9/MWh on average when at least one reactor is
      offline. Examining how suppliers adjust their bids during these outages, we attribute roughly 36%
      of the price increase to the exercise of market power, a transfer from consumers to suppliers of
      about $43–45 million per year.
    links:
      - name: SSRN
        icon: ssrn
        icon_pack: ai
        url: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=4616702
  - title: "Braking Bad: Can Driver-Assistance Technology Offset the Vehicle-Weight Externality?"
    coauthors: "Yongjoon Park"
    status: "Draft in progress"
    abstract: |
      Heavier vehicles protect their own occupants but endanger everyone they hit. Over the past decade, 
      vehicles have grown heavier just as Automatic Emergency Braking (AEB) has become widespread. We measure
      how much AEB offsets this externality, linking crash records from Texas, Massachusetts, and a national
      sample to each vehicle's weight and equipment. Identification comes from the roles vehicles play in 
      two-car crashes. Being hit by a vehicle 1,000 pounds heavier raises the risk of death by 44 to 62 percent.
      AEB avoids 30 to 40 percent of rear-end strikes but has no effect on angle and head-on crashes, which 
      account for 83 percent of the deaths that weight adds. Universal AEB would therefore prevent only 5 
      percent of those deaths and lower the corrective fee on weight from $234 to $220 per 1,000 pounds a year.
    links: []

