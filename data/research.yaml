working_papers:
  - title: "Market Power in the New England Electricity Market: Evidence from Nuclear Refueling Outages"
    coauthors: "Ming Ge, James Ji, and Matt Woerman"
    status: ""
    abstract: |
      Each of New England's four nuclear reactors refuels roughly every 18 months, taking it offline
      for about a month. We use these scheduled outages as supply shocks to study market power in the
      ISO New England wholesale electricity market. Using day-ahead market data from 2016 to 2018, we
      find that market-clearing prices rise by about $4.9/MWh on average when at least one reactor is
      offline. Examining how suppliers adjust their bids during these outages, we attribute roughly 36%
      of the price increase to the exercise of market power, a transfer from consumers to suppliers of
      about $43–45 million per year.
    links:
      - name: SSRN
        icon: ssrn
        icon_pack: ai
        url: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=4616702
  - title: "Braking Bad: Can Technology Offset the External Cost of Weight?"
    coauthors: "Yongjoon Park"
    status: "Work in progress"
    abstract: |
      A heavier vehicle protects its own occupants but endangers those of the vehicles it hits, and the
      fleet keeps getting heavier. Automatic emergency braking (AEB), required on new light vehicles from
      September 2029, could offset this harm by preventing crashes or lowering impact speeds. We combine
      NHTSA's national crash data with every police-reported crash in Massachusetts and every reportable
      crash in Texas, matching each vehicle's VIN to its curb weight and standard safety equipment. A
      striking vehicle 1,000 pounds heavier raises the risk of death by 53 percent of the mean nationally
      and 44 percent in Texas. Comparing the two vehicles within each crash, we find that AEB lowers the
      odds of striking the car ahead by 30 to 50 percent. It has no effect on angle, head-on, or sideswipe
      crashes, and it does not make each pound less harmful once we control for model year. AEB therefore
      works where the externality is smallest: rear-end crashes carry 8.5 percent of two-vehicle deaths
      nationally, while angle and head-on crashes carry 83 percent. A back-of-the-envelope calculation for
      Texas shows that 1,000 more pounds on every vehicle costs 219 lives a year in two-vehicle crashes,
      while AEB on every vehicle saves 13 to 27. Policy tools to regulate vehicle weight are still needed.
    links: []

