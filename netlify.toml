[build]
command = 'hugo'
publish = 'public'

[build.environment]
HUGO_VERSION = '0.105.0'

[context]
[context.branch-deploy]
command = 'hugo -F -b $DEPLOY_PRIME_URL'

[context.deploy-preview]
command = 'hugo -F -b $DEPLOY_PRIME_URL'

[context.production]
[context.production.environment]
HUGO_ENV = 'production'

# Statements are shared by direct link only: keep them out of search results.
[[headers]]
for = "/files/Zhou_Research_Statement.pdf"
[headers.values]
X-Robots-Tag = "noindex, nofollow"

[[headers]]
for = "/files/Zhou_Teaching_Statement.pdf"
[headers.values]
X-Robots-Tag = "noindex, nofollow"
