# Builds the Hugo site and publishes it to https://xiaolinzhou1997.github.io/
# (Netlify keeps building https://xiaolinzhou.netlify.app/ from the same branch.)
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.105.0  # keep in sync with netlify.toml and .Rprofile
    steps:
      - uses: actions/checkout@v4

      - name: Install Hugo
        run: |
          curl -sSL -o "${{ runner.temp }}/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_Linux-64bit.tar.gz"
          tar -xzf "${{ runner.temp }}/hugo.tar.gz" -C "${{ runner.temp }}" hugo
          echo "${{ runner.temp }}" >> "$GITHUB_PATH"

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          HUGO_ENV: production
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tell Bing (and DuckDuckGo, Yahoo, Yandex, which share IndexNow) that pages changed.
  # Only on real content pushes, not the daily Job Map refresh. Never fails the deploy.
  # The key must match static/<key>.txt. Google doesn't use IndexNow; it reads the sitemap.
  indexnow:
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      SITE: https://xiaolinzhou1997.github.io
      KEY: 4ed3276b0e61c6b54426946e7c984412
    steps:
      - name: Submit sitemap URLs
        run: |
          urls=$(curl -sSf "$SITE/sitemap.xml" | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -s -c .)
          echo "$urls"
          curl -sS -w '\nHTTP %{http_code}\n' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"xiaolinzhou1997.github.io\",\"key\":\"$KEY\",\"keyLocation\":\"$SITE/$KEY.txt\",\"urlList\":$urls}"
