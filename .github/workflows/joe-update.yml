# Daily refresh of the Job Map (/jobs/) from the AEA JOE listings export.
# Commits static/data/joe-postings.json only when postings changed, then republishes
# GitHub Pages (Netlify rebuilds on its own from the push).
#
# The export link is tied to one JOE issue (currently 2026-02). When JOE opens a new issue,
# copy the new XLS link from https://www.aeaweb.org/joe/listings and either paste it below
# or save it as a repository variable named JOE_EXPORT_URL (Settings -> Secrets and
# variables -> Actions -> Variables), which takes precedence.
name: Update Job Map data

on:
  schedule:
    - cron: "17 11 * * *"  # every day at 11:17 UTC (7:17 am Eastern in summer, 6:17 in winter)
  workflow_dispatch:

permissions:
  contents: write  # commit the refreshed data
  actions: write   # start the Pages deploy

concurrency:
  group: joe-update
  cancel-in-progress: false

env:
  JOE_EXPORT_URL: ${{ vars.JOE_EXPORT_URL || 'https://www.aeaweb.org/joe/resultset_xls_output.php?mode=xls_xml&q=eNplj0EKwkAMRe-SdYXShYseQBC8Q5jOxBqdZiCZVkrp3R2REcFd8v5P-H-DC1tmGU9JXCfoN2BB5zMvBL3MMTbwoPWZNKCRU3-r1KiYktT1TrGObDaXY-ja7nhoO2ggKY8sLp7_FJ9mybqi0vjzzNxCAa8pBlKr0DsJHFxcJjSvbhriN6CSXCfJmCSuFcVPXCfDEpwUh1wilGKF5fmdGh3s-wuYbliD' }}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/joe/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/joe/requirements.txt

      - name: Download JOE export
        run: |
          curl --fail --silent --show-error --location --retry 3 --retry-delay 20 \
            --user-agent "Mozilla/5.0 (compatible; job-map daily refresh; +https://xiaolinzhou1997.github.io/jobs/)" \
            --output "$RUNNER_TEMP/joe_export.xlsx" "$JOE_EXPORT_URL"
          ls -l "$RUNNER_TEMP/joe_export.xlsx"

      # Fails (and leaves the map as is) if the download is not a JOE spreadsheet or has no postings.
      - name: Rebuild map data
        run: python scripts/joe/build_joe.py "$RUNNER_TEMP/joe_export.xlsx"

      - name: Commit if postings changed
        id: commit
        run: |
          if git diff --quiet -- static/data/joe-postings.json; then
            echo "No change in postings."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/data/joe-postings.json
          git commit -m "Update Job Map data from JOE ($(date -u +%Y-%m-%d))"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with the workflow token don't trigger other workflows, so start the deploy here.
      - name: Republish GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${{ github.ref_name }}"
